services:
  foodapp:
    image: ${DOCKER_REGISTRY-}foodapp
    build:
      context: .
      dockerfile: FoodApp/Dockerfile
    environment:
      - ASPNETCORE_URLS=http://+:8080

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - foodapp
