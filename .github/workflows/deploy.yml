name: Build and Deploy .NET App to AlwaysData

on:
  push:
    branches:
      - main  # Runs automatically whenever you push code to main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup .NET 9 SDK on the GitHub runner
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore Dependencies
        run: dotnet restore FoodApp/FoodApp.csproj
        # 0. Migrate database
      - name: Clean Output Directory
        run: rm -rf ./publish

      # 3. Publish as a Self-Contained Linux App
      - name: Publish App
        run: dotnet publish FoodApp/FoodApp.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o ./publish


      # Remove appsettings.Development.json before deployment
      - name: Clean unnecessary files
        run: rm -f ./publish/appsettings.Development.json
      
      - name: Deploy via SFTP
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.B_FTP_PASS }}
          ARGS: "-avz --delete"
          SOURCE: "publish/"
          REMOTE_HOST: ${{ secrets.B_FTP_URL }}
          REMOTE_USER: ${{ secrets.B_FTP_USER }}
          TARGET: "www/food_app/"
          SCRIPT_AFTER: |
            chmod +x www/food_app/FoodApp
